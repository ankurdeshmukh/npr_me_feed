name: Build Morning Edition feed

on:
  schedule:
    # Times are UTC: six runs between about 4:45 and 6:45 AM Eastern, in both
    # standard and daylight time. GitHub's scheduler can run late, so it runs
    # several times; each run only adds stories that weren't in the feed yet.
    - cron: "45 9,10 * * *"
    - cron: "15 10,11 * * *"
    - cron: "40 10,11 * * *"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build feed
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FEED_TITLE: My Morning Edition
        run: python build_feed.py --out docs
      - name: Save state
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Feed update $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
